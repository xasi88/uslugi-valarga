<meta property="og:image:width" content="1200">

<body data-view="masters">

<header class="top" id="top">
  <a class="brand" href="#/">Валарг <span>услуги</span></a>
  <div class="top-acts">
    <button class="round" data-act="search" aria-label="Поиск"><svg class="i" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5"/></svg></button>
    <a class="round" href="#/razmestit" aria-label="Разместить"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></a>
  </div>
</header>

<main>
  <section id="board">
    <div class="wrap page-head">
      <h1 id="board-title">Работы мастеров <em>Валарга</em></h1>
      <p id="board-lead">Смотрите, как мастер уже сделал. Цена на фото.</p>
      <label class="search" id="search" hidden>
        <svg class="i" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Например: ворота, торт, проводка" aria-label="Поиск по доске" autocomplete="off">
      </label>
    </div>
    <div class="chips-wrap"><div class="chips" id="kinds" role="toolbar" aria-label="Виды работ"></div></div>
    <div class="wrap"><div class="grid" id="grid"></div></div>
    <ul class="reqs" id="reqs" hidden></ul>
    <div class="wrap"><div class="install" id="install" hidden><p><b>Поставьте доску на телефон</b><span id="install-text">Значок на экране, как у приложения. Доска открывается одним касанием.</span></p><button class="btn btn-ink" id="install-btn">Установить</button></div></div>
    <p class="wrap foot">Доска для жителей Валарга. Объявления проверяет админ WhatsApp-группы «Валарг».</p>
  </section>
  <section id="screen" hidden></section>
</main>
